name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated or runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          blocked="$(
            git ls-files \
              ':(glob)**/__pycache__/**' \
              ':(glob)**/.pytest_cache/**' \
              ':(glob)**/node_modules/**' \
              ':(glob)**/dist/**' \
              ':(glob)**/coverage/**' \
              ':(glob)**/*.pyc' \
              ':(glob)**/*.log' \
              ':(glob)**/*.sqlite' \
              ':(glob)**/*.sqlite3' \
              ':(glob)**/proofgarden.db' \
              ':(glob)**/test_proofgarden.db' \
              ':(glob)backend/uploads/**' \
              ':(glob)backend/test_uploads/**' \
              ':(glob)**/*.tsbuildinfo' \
              ':(glob)frontend/vite.config.js' \
              ':(glob)frontend/vite.config.d.ts'
          )"
          if [ -n "$blocked" ]; then
            echo "Generated or runtime artifacts are tracked:"
            echo "$blocked"
            echo "Move these out of git and update .gitignore if needed."
            exit 1
          fi
      - name: Validate Docker test compose file
        run: docker compose -f docker-compose.test.yml config

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
